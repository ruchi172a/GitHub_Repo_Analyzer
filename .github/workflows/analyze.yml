name: GitHub Repo Analyzer

# This will trigger the workflow manually or on a schedule
on:
  workflow_dispatch:   # This is for manual triggering (you can trigger it anytime)
  schedule:
    - cron: '0 7 * * *'  # Runs daily at 7:00 AM UTC (you can modify this)

jobs:
  analyze:
    runs-on: ubuntu-latest  # Use the latest Ubuntu runner

    steps:
      # Checkout the repository
      - name: Checkout repo
        uses: actions/checkout@v3

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # Install dependencies
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # Run GitHub Repo Analyzer script
      - name: Run GitHub Repo Analyzer
        env:
          MY_GITHUB_PAT: ${{ secrets.MY_GITHUB_PAT }}  # Your GitHub token stored as a secret
        run: |
          python github_analyzer.py  # Run the analyzer script

      # Optional: Upload the result as an artifact
      - name: Upload Report Artifact
        uses: actions/upload-artifact@v3.1.3
        with:
          name: github_repo_report
          path: github_repo_report.csv  # Path to the CSV file generated by your script